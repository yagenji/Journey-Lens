name: Build JOURNEY LENS

on:
  push:
    branches: [main]
    paths:
      - 'content/stories/**'
      - 'content/order.json'
      - 'index.html'
      - 'build.py'
  workflow_dispatch:

concurrency:
  group: build-journey-lens
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build (combine + generate)
        run: python3 build.py

      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "build: regenerate content.json + pages [skip ci]"
            git push
          fi
